# リポジトリ運用ポリシー（あるべき状態の宣言）
#
# sweeper（.github/workflows/sweeper.yml → scripts/sweep.sh）が毎日この定義と
# 各リポジトリの現状を突き合わせ、差分を是正する。個別リポジトリでの手動設定は不要。
#
# 収録の原則: **冪等に自動化できるものだけを型にする**。
# Web UI 必須の設定（GitHub Project の Status カラム定義など）は、毎日「差分あり」と
# 言い続ける壊れた仕組みになるため意図的に除外する。

# Issue/PR の種別ラベル（状態は Project カラムで持つため status:* は作らない）
# Conventional Commits の type に対応させる。
labels:
  - name: "type:feat"
    color: "0e8a16"
    description: "新機能"
  - name: "type:fix"
    color: "d73a4a"
    description: "バグ修正"
  - name: "type:refactor"
    color: "fbca04"
    description: "リファクタリング（挙動不変）"
  - name: "type:perf"
    color: "1d76db"
    description: "パフォーマンス改善"
  - name: "type:test"
    color: "c5def5"
    description: "テストの追加・修正"
  - name: "type:docs"
    color: "0075ca"
    description: "ドキュメント"
  - name: "type:chore"
    color: "ededed"
    description: "雑務・依存更新・CI設定など"

# リポジトリ設定として強制するもの
settings:
  # git remote show origin で参照される既定ブランチのシンボリック参照。
  # /security-review が origin/HEAD を必要とするため必須。
  default_branch_head: true

  # Secret scanning / push protection（public は無料。private は Advanced Security 必要）
  secret_scanning: true
  secret_scanning_push_protection: true

  # Dependabot 設定ファイルを配布（weekly / ルート。node: npm + github-actions / python: pip + github-actions / それ以外: github-actions のみ）
  dependabot: true

  # PR Bot コメント仕分け（.github/workflows/pr-triage.yml の呼び出しワークフロー）を配布し、
  # JEV キー TYPESAFE_API_KEY を各リポジトリの Secrets に配る。
  # AI レビューボットが付く PR で、同じ問題の指摘を束ねて種別順の表を固定コメントとして出す。正誤は判定しない。
  # Bot のいないリポジトリでは起動条件（Bot のレビュー）を満たさないので何も起きない。
  pr_triage: true

  # ↑ dependabot / pr_triage 共通の、保護ブランチへの届け方と却下の扱い（骨格 skeleton は PR を作らないので対象外）:
  #   - sweeper 管理の保護（必須チェック ci / build）は一時解除して置き再保護。手動保護・ruleset は sweeper/<name>-<hash8> ブランチ + PR
  #   - 人がマージせずに閉じた sweeper PR は「このリポジトリには要らない」の意思表示として記録する
  #       まだ既定ブランチに無いファイル（新規導入）: 雛形の中身が変わっても、保護を外しても、直接にも PR でも置かない
  #       既にあるファイルの更新: その内容に限って再提案しない（雛形の次の改善は届ける）
  #   - sweeper 自身が置き換えで閉じた PR は本文の [sweeper-superseded] かラベル sweeper-superseded で区別する。
  #     印の導入（2026-09-21T11:02Z）より前に閉じた PR は区別できないので数えない
  #   - 誤って閉じたときの戻し方: そのファイルの閉じた sweeper PR すべてにラベル sweeper-superseded を付ける（翌朝から再提案される）。急ぐなら手でファイルを置く

  # 骨格ファイル（templates/skeleton/: AGENTS.md / CLAUDE.md / .github/ISSUE_TEMPLATE/task.yml）が無ければ置く。
  # どのツール（Claude Code / Codex / Cursor / 手作業）で作ったリポジトリにも、翌朝には運用ルールの入口が入る。
  # 置いたら以後触らない（人が埋めた固有値を雛形で上書きしないため、収束の対象にしない）。
  # 人が消した（そのパスのコミット履歴があるのに今は無い）ファイルは「要らない」として置き直さない。
  # 手動保護・ruleset で直接置けないリポジトリには PR を作らず見送る（価値の低いファイルで人の手を煩わせない）。
  # .npmrc（ignore-scripts=true）は配らない: 既存リポジトリのネイティブビルドを壊しうるため。新規は claude-project-starter で入る
  skeleton: true


# 型から意図的に除外するもの（理由を明記して、再検討時の判断材料にする）
excluded:
  - item: "GitHub Project（板）の作成"
    reason: "板を作れてもStatusカラムの定義がWeb UI必須で冪等化できない。実運用していない板を増やすと管理対象の水増しになる"
  - item: "GitHub既定ラベル（bug / enhancement 等）の削除"
    reason: "削除は破壊的で復元コストがある。差分として報告するに留め、判断は人間に委ねる"
  - item: "セッション間連絡（agent pairing）の各リポジトリへの配布"
    reason: "使うのはクラウドとローカルで並行作業するプロジェクトだけで、全リポジトリではない。配ると使わない .claude/ が増える。加えてタグ付けも trigger 作成も実行時の操作でリポジトリの状態ではないため、そもそも収束の対象にならない。正本は docs/AGENT-PAIRING.md に置き、必要になった時点で raw.githubusercontent.com から取得する（クラウドからは api.github.com が 403 でも raw.githubusercontent.com は 200）。存在を知らせる数行だけ templates/claude-md-pairing-snippet.md として用意し、必要なプロジェクトの CLAUDE.md に貼る"
