# ci-standard 自身の検査（PR ごと）: シェル構文・YAML・pr-triage の単体テスト
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: シェル構文
        run: for f in scripts/*.sh scripts/pr-triage/*.sh; do bash -n "$f"; done
      - name: YAML 構文
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.2'
          # node-ci.yml は判定を python3 -I（user site を読まない）で動かすので、system 側にも入れて本番の経路で試す
          python3 -I -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 -c 'import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob(".github/workflows/*.yml")+glob.glob("templates/*.yml")+glob.glob("templates/skeleton/*.yml")+glob.glob("templates/skeleton/*.yaml")]'
      - name: 配布する Issue フォームの形（GitHub は形が崩れていると Issue テンプレ画面ごと落とす）
        run: shopt -s nullglob; python3 scripts/check-issue-forms.py templates/skeleton/*.yml templates/skeleton/*.yaml
      - name: トリガー検証の単体テスト
        # ゲート本体より先に走らせる。ゲート自身が壊れて常に成功を返しても気付けないため、
        # 「壊れた入力を確実に落とす」ことをテストで担保する。
        run: python3 -m unittest discover -s scripts -p 'test_validate_triggers.py' -v

      - name: jactionlint の版とチェックサムが揃っているか
        run: bash scripts/check-jactionlint-pins.sh

      - name: ワークフローの文法と式の検査（jactionlint）
        # run: の中の ${{ … }} も Actions の式として評価される。読めない式が 1 つあると、ワークフロー全体が起動しない。
        # 2026-10-04 に、判定スクリプトの f-string の ${{…}} で node-ci.yml を全リポジトリで止めかけた再発防止。
        # 対象: このリポジトリのワークフロー（.yml・.yaml を jactionlint が自動で探す）、配布するテンプレート、
        #       sweep.sh がヒアドキュメントで組み立てて全リポジトリに配る ci.yml（node・python の両方）。
        # correctness プロファイル（actionlint 相当の検査）で判定する。shellcheck と pyflakes の検査は対象外にしている
        # （目的はワークフローの文法と式）。
        # 版を上げるときは、https://github.com/jdx/jactionlint/releases の jactionlint_<版>_checksums.txt から
        # linux_amd64.tar.gz の行の値を JACTIONLINT_SHA256 に写す（取得物を照合してから実行するため）。
        # node-ci.yml・python-ci.yml にも同じ値があり、scripts/check-jactionlint-pins.sh が揃っているかを見る。
        # node-ci.yml・python-ci.yml の版は、呼び出し側の全リポジトリの必須チェック ci / build に効く（呼び出しは @main）。
        # 新しい版で correctness の規則が増えることがあるので、上げる前に全リポジトリの既定ブランチで
        # `jactionlint --profile correctness --shellcheck= --pyflakes= --no-online` が通ることを確かめる。
        # 配布元: jdx/jactionlint（mise の作者 jdx による actionlint のフォーク。MIT）。チェックサムの写しは
        # 「その時点の配布物と同じ」しか保証しないので、固定したハッシュの配布物が jdx/jactionlint の CI で
        # ビルドされたこと（GitHub artifact attestation）もここで毎回照合する。
        # 照合は、このジョブで jactionlint を一度でも動かすより前に行う（先に動いた不正な配布物が GITHUB_PATH で
        # gh を差し替えると照合を偽装できるため）。そのためこのステップは、配布するジョブ本体を動かすステップより前に置く。
        # トークンは照合にだけ使い、jactionlint を動かす前に消す。
        env:
          JACTIONLINT_VERSION: '2.2.0'
          JACTIONLINT_SHA256: 8137d5bfe266dd5e48d2af2306827785ce07c6988e04b1c3d6ad4776e97d27d2
          STANDARD_REPO: sinoda1114/ci-standard
          ATTESTATION_TOKEN: ${{ github.token }}
        run: |
          tarball="jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --retry 3 --retry-all-errors -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/jdx/jactionlint/releases/download/v${JACTIONLINT_VERSION}/${tarball}"
          echo "${JACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          GH_TOKEN="$ATTESTATION_TOKEN" gh attestation verify "$RUNNER_TEMP/$tarball" --repo jdx/jactionlint
          unset ATTESTATION_TOKEN
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" jactionlint
          lint() { "$RUNNER_TEMP/jactionlint" --no-hints --no-online --profile correctness --shellcheck= --pyflakes= "$@"; }
          lint
          lint templates/*.yml
          # sweep.sh の関数だけを取り出して、配る ci.yml を実際に組み立てる（sweep.sh 全体は走らせない）
          eval "$(sed -n '/^standard_ci_body()/,/^}/p' scripts/sweep.sh)"
          mkdir -p "$RUNNER_TEMP/dist/.github/workflows"
          for kind in node python; do standard_ci_body "$kind" main > "$RUNNER_TEMP/dist/.github/workflows/ci-$kind.yml"; done
          lint "$RUNNER_TEMP"/dist/.github/workflows/ci-*.yml

      - name: 配布する workflow-lint ジョブの本体を実際に走らせる
        # 配布物の出所は直前のステップで照合済み（同じハッシュの配布物を取り直して動かす）。
        # node-ci.yml・python-ci.yml のステップを書かれたとおりに動かす（フラグや終了コードの扱いを誤ると、全リポジトリの ci / build が落ちるため）
        run: python3 scripts/run-workflow-lint-step.py

      - name: ワークフローのトリガー名検証
        # YAML として妥当でも、存在しないイベント名は GitHub が構文エラーにする。
        # 2026-09-21 に pull_request_review_thread を配布して全リポジトリを止めた再発防止。
        run: python3 scripts/validate-triggers.py

      - name: audit の例外リスト判定の単体テスト
        run: python3 -m unittest discover -s scripts -p 'test_audit_gate.py' -v

      - name: pr-triage 単体テスト
        run: python3 -m unittest discover -s scripts/pr-triage -v
      - name: sweep.sh スモーク（gh スタブ。bash -n では未定義変数などの実行時エラーを検出できない）
        run: bash scripts/test-sweep-smoke.sh
      - name: health-watch.sh スモーク（gh スタブ。確認できなかったものを OK と報告しないことを見る）
        run: bash scripts/test-health-smoke.sh
