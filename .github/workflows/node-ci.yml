# Node/TS 標準CI（Reusable Workflow）
#
# 呼び出し側リポジトリの構成を自動判定し、存在するものだけ実行する:
#   - lint / typecheck / test(カバレッジ優先) / build … package.json の scripts から判定
#   - npm audit … package-lock.json があれば実行
#   - e2e … playwright.config.* があればジョブごと実行（無ければ skipped）
#
# リポジトリ固有のCI用環境変数（非シークレット）は .github/ci.env に
# KEY=VALUE 形式で置くと自動で読み込まれる。シークレットは呼び出し側の
# `secrets: inherit` でそのまま届く。
#
# ブランチ保護の必須チェックは「ci / build」「ci / e2e」を指定する想定
# （e2e はジョブ skip 時も必須チェックを満たす）。

name: Node CI (standard)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js のバージョン"
        type: string
        required: false
        default: "20"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has-e2e: ${{ steps.checks.outputs.has-e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: checks
        name: e2e 構成の有無を判定
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-e2e=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: CI用環境変数を読み込み (.github/ci.env)
        run: |
          if [ -f .github/ci.env ]; then
            grep -v '^\s*#' .github/ci.env >> "$GITHUB_ENV"
          fi

      - name: 実行対象スクリプトを判定
        run: |
          has() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }
          echo "HAS_LINT=$(has lint && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_TYPECHECK=$(has typecheck && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_COVERAGE=$(has test:coverage && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_TEST=$(has test && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_BUILD=$(has build && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: env.HAS_LINT == 'true'
        run: npm run lint

      - name: Typecheck
        if: env.HAS_TYPECHECK == 'true'
        run: npm run typecheck

      - name: Test (カバレッジ閾値チェック込み)
        if: env.HAS_COVERAGE == 'true'
        run: npm run test:coverage

      - name: Test
        if: env.HAS_COVERAGE == 'false' && env.HAS_TEST == 'true'
        run: npm test

      - name: Build
        if: env.HAS_BUILD == 'true'
        run: npm run build

      - name: Audit (high以上を検出)
        run: npm audit --audit-level=high

  e2e:
    needs: detect
    if: needs.detect.outputs.has-e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: CI用環境変数を読み込み (.github/ci.env)
        run: |
          if [ -f .github/ci.env ]; then
            grep -v '^\s*#' .github/ci.env >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: DBマイグレーション（スクリプトがあれば）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate'] ? 0 : 1)"; then
            npm run db:migrate
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
