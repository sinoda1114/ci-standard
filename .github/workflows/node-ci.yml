# Node/TS 標準CI（Reusable Workflow）
#
# 呼び出し側リポジトリの構成を自動判定し、存在するものだけ実行する:
#   - パッケージマネージャ … lockfile から自動判定（npm / pnpm / yarn）。corepack で有効化
#   - lint / typecheck / test(カバレッジ優先) / build … package.json の scripts から判定
#   - audit … high 以上で失敗（yarn のみ best-effort）
#   - e2e … playwright.config.* があればジョブごと実行（.github/ci-skip-e2e でオプトアウト可）
#   - quality … Fallow（未使用コード/重複/複雑度）+ React Doctor（Reactアンチパターン）。
#               既定 report-only/advisory、.github/fallow-strict を置くと両方が強制モードになる
#   - package.json が無い場合（テンプレ直後の空リポジトリ）は全て skip して緑にする
#
# リポジトリ固有のCI用環境変数（非シークレット）は .github/ci.env に KEY=VALUE で置く。
#
# サプライチェーン規律:
#   - 外部 action は SHA 固定（タグの改ざん・付け替えに追従しないため）
#   - GITHUB_TOKEN は contents: read のみ（least privilege）
#
# ブランチ保護の必須チェックは「ci / build」「ci / e2e」を指定する想定
# （e2e はジョブ skip 時も必須チェックを満たす）。

name: Node CI (standard)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js のバージョン"
        type: string
        required: false
        default: "22"
    secrets:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        description: "Clerk publishable key (E2E / Next.js)"
        required: false
      CLERK_SECRET_KEY:
        description: "Clerk secret key (E2E / Testing Token)"
        required: false

permissions:
  contents: read

# corepack が pnpm/yarn を初回DLする際の対話プロンプトでCIが止まらないようにする
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-node: ${{ steps.checks.outputs.has-node }}
      has-e2e: ${{ steps.checks.outputs.has-e2e }}
      pm: ${{ steps.checks.outputs.pm }}
      fallow-strict: ${{ steps.checks.outputs.fallow-strict }}
      has-react: ${{ steps.checks.outputs.has-react }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: checks
        name: リポジトリ構成とパッケージマネージャを判定
        run: |
          if [ -f package.json ]; then
            echo "has-node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json が無いため Node ステップをスキップ（テンプレ/初期リポジトリ）"
          fi
          # パッケージマネージャは lockfile で判定（setup-node の cache 指定にも使う）
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
          # React 系リポジトリのみ React Doctor を走らせる（依存に react があるかで判定）
          if [ -f package.json ] && node -e "const p=require('./package.json');process.exit((p.dependencies?.react||p.devDependencies?.react)?0:1)" 2>/dev/null; then
            echo "has-react=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-react=false" >> "$GITHUB_OUTPUT"
          fi
          # .github/fallow-strict があるリポジトリは Fallow の指摘でCIを落とす（オプトイン）。
          # 既定は report-only（既存コードベースに後付けしても赤くならないようにするため）。
          if [ -f .github/fallow-strict ]; then
            echo "fallow-strict=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallow-strict=false" >> "$GITHUB_OUTPUT"
          fi
          # .github/ci-skip-e2e が置いてあるリポジトリは e2e を CI 対象外にする（ローカル専用e2e向け）
          if [ -f .github/ci-skip-e2e ]; then
            echo "has-e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.github/ci-skip-e2e により e2e をスキップ"
          elif ls playwright.config.* >/dev/null 2>&1; then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-e2e=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack で package.json の packageManager フィールドに従い pnpm/yarn を有効化
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ needs.detect.outputs.pm }}

      - name: CI用環境変数を読み込み (.github/ci.env)
        run: |
          if [ -f .github/ci.env ]; then
            grep -v '^\s*#' .github/ci.env >> "$GITHUB_ENV"
          fi

      - name: 実行対象スクリプトを判定
        run: |
          has() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }
          echo "HAS_LINT=$(has lint && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_TYPECHECK=$(has typecheck && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_COVERAGE=$(has test:coverage && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_TEST=$(has test && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_BUILD=$(has build && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          PM: ${{ needs.detect.outputs.pm }}
        run: |
          # lockfile があれば厳格（再現性優先）、無ければ警告して通常インストール（CIを詰まらせない）。
          # lockfile はコミット対象という方針のため、無い場合は警告で是正を促す。
          ignored_builds_help() {
            echo "::error::pnpm の install に失敗しました。ERR_PNPM_IGNORED_BUILDS なら、リポジトリの pnpm-workspace.yaml に allowBuilds を書いてください。"
            echo "::notice::例）allowBuilds:%0A  sharp: false%0A  unrs-resolver: false  # prebuilt があるのでソースビルドは不要"
            echo "::notice::ビルドが本当に必要なパッケージだけ true にしてください。.npmrc の ignore-scripts=true は外さないこと（postinstall 経由の供給網攻撃を防ぐ要）。"
          }
          case "$PM" in
            pnpm)
              # pnpm 10 以降、ビルドスクリプトを持つ依存は「許可するか」を明示しないと
              # ERR_PNPM_IGNORED_BUILDS で install ごと落ちる（.npmrc の ignore-scripts=true と組み合わさるため）。
              # 旧 --config.strict-dep-builds=false は pnpm 12 で効かない（2026-09-22 に 12.5.1 で実測）。
              # 回避策は CLI・環境変数・package.json のいずれにも無く、リポジトリ側の
              # pnpm-workspace.yaml に allowBuilds で各パッケージの可否を書くしかない。
              # 落ちたときに何をすればよいかをログに出す（原因が分からないまま赤くしない）。
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile || { ignored_builds_help; exit 1; }
              else echo "::warning::pnpm-lock.yaml が無いためロック無しインストール（lockfile のコミットを推奨）"; pnpm install || { ignored_builds_help; exit 1; }; fi ;;
            yarn)
              if [ -f yarn.lock ]; then corepack yarn install --immutable || yarn install --frozen-lockfile
              else echo "::warning::yarn.lock が無いためロック無しインストール（lockfile のコミットを推奨）"; yarn install; fi ;;
            *)
              if [ -f package-lock.json ]; then npm ci
              else echo "::warning::package-lock.json が無いためロック無しインストール（lockfile のコミットを推奨）"; npm install; fi ;;
          esac

      - name: Lint
        if: env.HAS_LINT == 'true'
        run: ${{ needs.detect.outputs.pm }} run lint

      - name: Typecheck
        if: env.HAS_TYPECHECK == 'true'
        run: ${{ needs.detect.outputs.pm }} run typecheck

      - name: Test (カバレッジ閾値チェック込み)
        if: env.HAS_COVERAGE == 'true'
        run: ${{ needs.detect.outputs.pm }} run test:coverage

      - name: Test
        if: env.HAS_COVERAGE == 'false' && env.HAS_TEST == 'true'
        run: ${{ needs.detect.outputs.pm }} test

      - name: Build
        if: env.HAS_BUILD == 'true'
        run: ${{ needs.detect.outputs.pm }} run build

      # 修正版が公開されていない脆弱性は、リポジトリの .github/audit-allowlist に理由と期限つきで書けば除外できる
      # （書式と判定は scripts/audit-gate.py）。ファイルが無いリポジトリは従来どおりの audit のまま。
      # .github/audit-omit-dev があるリポジトリだけ、npm は --omit=dev、pnpm は --prod で本番依存だけを見る。
      # 期限は今日から 120 日以内に限り、critical は例外リストに書いても除外しない。
      # pnpm の独自の除外設定（auditConfig.ignoreGhsas / ignoreCves）は、例外リストの有無にかかわらず落とす。
      # 判定スクリプトは、呼び出されたこのワークフローと版がずれないよう下に埋め込む（scripts/audit-gate.py と同一。
      # 一致は self-test の test_audit_gate.py が検査する）。
      - name: Audit (high以上を検出)
        env:
          PM: ${{ needs.detect.outputs.pm }}
        run: |
          cat > "$RUNNER_TEMP/audit-gate.py" <<'AUDIT_GATE_PY'
          #!/usr/bin/env python3
          """npm / pnpm audit の結果を、リポジトリの例外リスト（.github/audit-allowlist）と突き合わせて合否を出す。

          修正版がまだ公開されていない脆弱性で CI が止まり続けるのを避けるための仕組み。
          high 以上で落とす方針はそのままにし、除外は理由と期限つきで記録に残す。

          使い方: npm audit --json | python3 audit-gate.py --pm npm --allowlist .github/audit-allowlist [--today YYYY-MM-DD]
                 python3 audit-gate.py --pm pnpm --config-only --project-dir .   # pnpm の独自の除外設定だけを検査

          例外リストの書式（1 行 1 件。# で始まる行はコメント。理由の中の # はそのまま理由の一部）:
              GHSA-xxxx-xxxx-xxxx  YYYY-MM-DD  理由
            期限の日を過ぎた行は無効になり、CI を落とす（放置を防ぐため）。
            期限は今日から MAX_EXPIRY_DAYS（120）日以内に限る。それより先の期限は書式エラーと同じく落とす（実質の無期限化を防ぐ）。
            critical は例外リストに書いてあっても除外しない（必ず直す）。

          pnpm の独自の除外設定（package.json の pnpm.auditConfig、pnpm-workspace.yaml の auditConfig にある
          ignoreGhsas / ignoreCves）は、理由も期限もなく除外できてしまうので、見つけたら落とす（--config-only）。

          終了コード: 0 = 通す / 1 = 落とす（未登録の high 以上、期限切れ、書式エラー、audit の失敗や想定外の形の JSON）
          GHSA の ID を取り出せない high 以上の advisory は、例外リストで扱えないので常に落とす（fail-closed）。
          期限の判定は UTC の日付で行う（TZ の設定に左右されない）。
          """
          import argparse
          import datetime
          import json
          import os
          import re
          import sys

          BLOCKING = {'high', 'critical'}
          SEVERITIES = {'info', 'low', 'moderate', 'high', 'critical'}
          GHSA_RE = re.compile(r'GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}')
          MAX_EXPIRY_DAYS = 120
          PNPM_IGNORE_KEYS = ('ignoreGhsas', 'ignoreCves')


          def utc_today():
              """期限の判定に使う今日の日付（UTC）。TZ が設定されていても変わらない。"""
              return datetime.datetime.now(datetime.timezone.utc).date()


          def text(value):
              """外部の値を文字列として扱う（文字列以外は空文字）。型違いで落ちないようにする。"""
              return value if isinstance(value, str) else ''


          def severity_of(obj):
              """重大度を返す。辞書でない・文字列でない・未知の値は None（呼び出し側で構造の不正とする）。"""
              sev = obj.get('severity') if isinstance(obj, dict) else None
              return sev if isinstance(sev, str) and sev in SEVERITIES else None


          def add_found(found, ghsa, sev, pkg):
              """同じ GHSA が複数パッケージに出ても上書きせず、パッケージ名をまとめ、重い方の重大度を残す。"""
              old_sev, pkgs = found.get(ghsa, (sev, set()))
              found[ghsa] = ('critical' if 'critical' in (old_sev, sev) else sev, pkgs | {pkg})


          def emit(kind, message):
              """ワークフローコマンドを 1 行で出す。外部の文字列の改行で別のコマンド行が作られないよう無害化する。"""
              safe = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{kind}::{safe}')


          LINE_RE = re.compile(r'^(GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4})\s+(\d{4}-\d{2}-\d{2})\s+(\S.*)$')


          def load_allowlist(path):
              """{GHSA: (期限, 理由)} と書式エラーの一覧を返す。"""
              entries, errors = {}, []
              try:
                  with open(path, encoding='utf-8-sig') as f:  # BOM 付きでも読めるように
                      lines = f.readlines()
              except (OSError, UnicodeDecodeError) as e:
                  return {}, [f'{path}: 例外リストを UTF-8 として読めません（{type(e).__name__}）']
              for no, raw in enumerate(lines, 1):
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  m = LINE_RE.match(line)
                  if not m:
                      errors.append(f'{path}:{no}: 書式が違います（GHSA-ID 期限YYYY-MM-DD 理由）: {line}')
                      continue
                  try:
                      expiry = datetime.date.fromisoformat(m.group(2))
                  except ValueError:
                      errors.append(f'{path}:{no}: 期限が日付として読めません: {m.group(2)}')
                      continue
                  if m.group(1) in entries:
                      errors.append(f'{path}:{no}: 同じ GHSA が重複しています（1 行にまとめてください）: {m.group(1)}')
                      continue
                  entries[m.group(1)] = (expiry, m.group(3))
              return entries, errors


          def normalize_key(key):
              """大文字小文字・ハイフン・下線の違いを無視して比べるための形にする（綴りを変えてのすり抜けを防ぐ）。"""
              return key.lower().replace('-', '').replace('_', '') if isinstance(key, str) else None


          def ignore_settings(section):
              """auditConfig の中の空でない除外設定を「auditConfig.ignoreGhsas」の形で返す（書かれた綴りのまま）。"""
              wanted = {normalize_key(k) for k in PNPM_IGNORE_KEYS}
              found = []
              for key, cfg in section.items():
                  if normalize_key(key) != 'auditconfig' or not isinstance(cfg, dict):
                      continue
                  found += [f'{key}.{k}' for k, v in cfg.items() if normalize_key(k) in wanted and v]
                  # 展開後の名前は CI の環境で変わるので、${…} を含むキーは除外設定かどうか確かめられない
                  found += [str(key) + '.' + k + '（${…} の展開を含むキーは検査できないため使えません）'
                            for k in cfg if isinstance(k, str) and '${' in k]
              return found


          def yaml_ignore_settings(yaml, root):
              """YAML のノードを全部たどり、空でない除外設定と ${…} を含むキーがある場所を返す。

              PyYAML と pnpm は、重複キーやマージキー（<<）でどの値が勝つかが食い違うことがある。
              勝つ値を計算せず、ファイルに書かれているものを全部見る（どの値が勝っても見落とさない）。
              """
              wanted = {normalize_key(k) for k in PNPM_IGNORE_KEYS}
              found, seen = [], set()

              def has_content(node):
                  if isinstance(node, (yaml.SequenceNode, yaml.MappingNode)):
                      return bool(node.value)
                  return node.tag != 'tag:yaml.org,2002:null'  # 引用符つきの 'null' や '~' は文字列なので空ではない

              def walk(node, path, in_audit):
                  # 同じノードでも auditConfig の下かどうかで見方が変わる（アンカーを別名で auditConfig に入れる書き方）
                  if (id(node), in_audit) in seen:  # 循環も含めて、同じ見方では一度だけたどる
                      return
                  seen.add((id(node), in_audit))
                  if isinstance(node, yaml.SequenceNode):
                      for item in node.value:
                          walk(item, path, in_audit)
                  elif isinstance(node, yaml.MappingNode):
                      for key_node, value_node in node.value:
                          if not isinstance(key_node, yaml.ScalarNode):
                              # 配列などのキーを文字列にするパーサーでは、除外設定の名前になりうる。pnpm の設定として正しくないので落とす
                              found.append('.'.join(path + ['?']) + '（スカラーでないキーは使えません）')
                              walk(key_node, path + ['?'], in_audit)
                              walk(value_node, path + ['?'], in_audit)
                              continue
                          key = key_node.value
                          name = path + [key]
                          # 除外設定として効くのは auditConfig の下だけ（catalogs などの同じ名前のキーは別物）
                          if in_audit and normalize_key(key) in wanted and has_content(value_node):
                              found.append('.'.join(name))
                          # pnpm 11 は ${VAR} を展開する。展開後の名前は CI の環境で変わるので、展開を含むキーは落とす
                          if '${' in key:
                              found.append('.'.join(name) + '（${…} の展開を含むキーは検査できないため使えません）')
                          walk(value_node, name, in_audit or normalize_key(key) == 'auditconfig')

              if root is not None:
                  walk(root, [], False)
              return found


          def pnpm_config_errors(project_dir):
              """pnpm の独自の除外設定を探し、見つかった場所の一覧を返す（無ければ空）。"""
              errors = []
              pkg = os.path.join(project_dir, 'package.json')
              if os.path.exists(pkg):
                  try:
                      with open(pkg, encoding='utf-8-sig') as f:
                          data = json.load(f)
                  except (OSError, ValueError, RecursionError) as e:  # RecursionError は入れ子が深すぎるとき
                      return [f'package.json を読めません（{type(e).__name__}）。除外設定の有無を確かめられないため通しません']
                  pnpm = data.get('pnpm') if isinstance(data, dict) else None
                  if isinstance(pnpm, dict):
                      errors += ['package.json の pnpm.' + name for name in ignore_settings(pnpm)]
              ws = os.path.join(project_dir, 'pnpm-workspace.yaml')
              if os.path.exists(ws):
                  try:
                      with open(ws, encoding='utf-8-sig') as f:
                          body = f.read()
                  except (OSError, UnicodeDecodeError) as e:
                      return errors + [f'pnpm-workspace.yaml を読めません（{type(e).__name__}）。除外設定の有無を確かめられないため通しません']
                  try:
                      import yaml  # GitHub のランナー（ubuntu）には入っている
                  except ImportError:
                      # 名前の検索で代わりにするとエスケープ表記ですり抜けられるので、検査できないとして落とす
                      return errors + ['pnpm-workspace.yaml を検査するための YAML パーサー（PyYAML）がありません。除外設定の有無を確かめられないため通しません']
                  try:
                      root = yaml.compose(body, Loader=yaml.SafeLoader)  # 値は組み立てず、書かれたままの形で見る
                      found = yaml_ignore_settings(yaml, root)
                  except (yaml.YAMLError, RecursionError) as e:  # RecursionError は入れ子が深すぎるとき
                      detail = type(e).__name__ + (': ' + e.problem if getattr(e, 'problem', None) else '')
                      return errors + [f'pnpm-workspace.yaml を YAML として読めません（{detail}）。除外設定の有無を確かめられないため通しません']
                  errors += ['pnpm-workspace.yaml の ' + name for name in found]
              return errors


          def shape_error(report, pm):
              """audit が失敗した・想定外の形のときに理由を返す（正常なら None）。

              npm は失敗すると {"error": …} という正しい JSON を出して非 0 で終わり、ワークフローは
              その終了コードを捨てている。形を確かめないと「0 件」として通してしまう（fail-open）。
              """
              if not isinstance(report, dict):
                  return f'audit の結果がオブジェクトではありません（{type(report).__name__}）'
              if 'error' in report:
                  err = report['error']
                  detail = err.get('summary') or err.get('code') if isinstance(err, dict) else err
                  return f'audit が失敗しました: {detail}'
              if pm == 'pnpm':
                  if not isinstance(report.get('advisories'), dict) or 'metadata' not in report:
                      return 'pnpm audit の結果に advisories / metadata がありません'
              elif 'auditReportVersion' not in report or not isinstance(report.get('vulnerabilities'), dict):
                  return 'npm audit の結果に auditReportVersion / vulnerabilities がありません'
              return None


          def pnpm_advisories(report):
              """pnpm: {GHSA: (重大度, パッケージ名)} と、除外できない指摘（ID なし・重大度が不明）の一覧。"""
              found, bad, broken = {}, [], []
              for adv in report['advisories'].values():
                  sev = severity_of(adv)
                  mod = text(adv.get('module_name')) if isinstance(adv, dict) else ''
                  if sev is None:
                      broken.append(f'{mod or "?"} (重大度が不明、または構造が不正)')
                  elif sev in BLOCKING:
                      ghsa = ''.join(GHSA_RE.findall(text(adv.get('github_advisory_id')))[:1]) \
                          or ''.join(GHSA_RE.findall(text(adv.get('url')))[:1])
                      if ghsa:
                          add_found(found, ghsa, sev, mod or '?')
                      else:
                          bad.append(f"{mod or '?'} ({sev}, url={text(adv.get('url')) or '-'})")
              return found, bad, broken


          def reaches_blocking_advisory(name, vulns, seen=None):
              """npm: 項目 name から、依存元の参照をたどって high 以上の advisory 本体に届くか（循環は届かない扱い）。"""
              seen = seen or set()
              if name in seen or not isinstance(vulns.get(name), dict):
                  return False
              seen.add(name)
              for via in vulns[name].get('via') or []:
                  if severity_of(via) in BLOCKING:
                      return True
                  if isinstance(via, str) and reaches_blocking_advisory(via, vulns, seen):
                      return True
              return False


          def npm_advisories(report):
              """npm: {GHSA: (重大度, パッケージ名)} と、除外できない指摘（ID なし・構造が不正）の一覧。"""
              found, bad, broken = {}, [], []
              vulns = report['vulnerabilities']
              for name, vuln in vulns.items():
                  # 構造の壊れた項目を黙って無視しない（high 以上が隠れる経路になるため）
                  if not isinstance(vuln, dict) or not isinstance(vuln.get('via'), list) or severity_of(vuln) is None:
                      broken.append(f'{name} (via がリストでない、または重大度が不明)')
                      continue
                  dangling = False
                  for via in vuln['via']:
                      if isinstance(via, str):
                          if via not in vulns:  # 参照先が無いのは壊れた結果。別の経路で届いても見逃さない
                              broken.append(f'{name} (参照先の項目がありません: {via})')
                              dangling = True
                          continue  # 依存元を指すだけ。advisory 本体は別の項目にある（到達は下で確かめる）
                      sev = severity_of(via)
                      if sev is None:
                          broken.append(f'{name} (advisory の重大度が不明)')
                      elif sev in BLOCKING:
                          ids = GHSA_RE.findall(text(via.get('url')))
                          pkg = text(via.get('name')) or name
                          if ids:
                              add_found(found, ids[0], sev, pkg)
                          else:
                              bad.append(f"{pkg} ({sev}, url={text(via.get('url')) or '-'})")
                  if not dangling and severity_of(vuln) in BLOCKING and not reaches_blocking_advisory(name, vulns):
                      broken.append(f"{name} ({vuln['severity']}, high 以上の advisory 本体に到達できません)")
              return found, bad, broken


          def advisories(report, pm):
              """{GHSA: (重大度, パッケージ名)}、GHSA の ID が無い high 以上、構造エラーの 3 つを返す（後の 2 つは除外できない）。"""
              return pnpm_advisories(report) if pm == 'pnpm' else npm_advisories(report)


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--pm', choices=['npm', 'pnpm'], default='npm')
              ap.add_argument('--allowlist')
              ap.add_argument('--config-only', action='store_true', help='pnpm の独自の除外設定だけを検査する（audit の JSON は読まない）')
              ap.add_argument('--project-dir', default='.', help='--config-only で検査するディレクトリ')
              ap.add_argument('--today', type=datetime.date.fromisoformat, default=None,
                              help='判定日 YYYY-MM-DD（省略時は UTC の今日）。日付でない値は使い方のエラーになる')
              a = ap.parse_args()
              today = a.today or utc_today()
              if a.config_only:
                  found_cfg = pnpm_config_errors(a.project_dir) if a.pm == 'pnpm' else []
                  for c in found_cfg:
                      emit('error', f'pnpm の独自の除外設定は使えません: {c}（理由と期限つきで .github/audit-allowlist に移してください）')
                  print(f'audit-gate: pnpm の除外設定 {len(found_cfg)} 件 → {"失敗" if found_cfg else "通過"}')
                  return 1 if found_cfg else 0
              if not a.allowlist:
                  ap.error('--allowlist が必要です（--config-only のときを除く）')

              try:
                  report = json.load(sys.stdin)
              except ValueError as e:
                  emit('error', f'audit の JSON が読めません: {e}')
                  return 1
              problem = shape_error(report, a.pm)
              if problem:
                  emit('error', f'{problem}（audit が実行できていない可能性があります。脆弱性なしとは扱いません）')
                  return 1
              allow, errors = load_allowlist(a.allowlist)
              try:
                  found, no_id, broken = advisories(report, a.pm)
              except Exception as e:  # 想定外の構造でもトレースバックではなく判定の失敗として扱う
                  emit('error', f'audit の結果を解釈できません（{type(e).__name__}: {e}）')
                  return 1

              limit = today + datetime.timedelta(days=MAX_EXPIRY_DAYS)
              for ghsa, (expiry, _) in sorted(allow.items()):
                  if expiry > limit:
                      errors.append(f'例外の期限が先すぎます（今日から {MAX_EXPIRY_DAYS} 日以内、{limit} までにしてください）: {ghsa} 期限 {expiry}')

              blocking, critical, expired, allowed = [], [], [], 0
              for ghsa, (sev, pkgs) in sorted(found.items()):
                  pkg = ', '.join(sorted(pkgs))
                  if ghsa not in allow:
                      blocking.append(f'{ghsa} ({sev}, {pkg})')
                  elif sev == 'critical':
                      critical.append(f'{ghsa} ({sev}, {pkg})')
                  elif allow[ghsa][0] < today:
                      expired.append(f'{ghsa} ({sev}, {pkg}) 期限 {allow[ghsa][0]}')
                  else:
                      allowed += 1
                      emit('notice', f'例外リストにより除外: {ghsa} ({sev}, {pkg}) 期限 {allow[ghsa][0]} 理由: {allow[ghsa][1]}')
              for ghsa in sorted(set(allow) - set(found)):
                  if allow[ghsa][0] < today:  # 使われていなくても期限切れの行は放置させない
                      expired.append(f'{ghsa}（使われていない例外）期限 {allow[ghsa][0]}')
                  else:
                      emit('notice', f'使われていない例外です（解消済みなら行を消してください）: {ghsa}')

              for e in errors:
                  emit('error', e)
              for b in blocking:
                  emit('error', f'high 以上の脆弱性（例外リストに無し）: {b}')
              for c in critical:
                  emit('error', f'critical は例外リストに書いてあっても除外しません（必ず直してください）: {c}')
              for n in no_id:
                  emit('error', f'high 以上の脆弱性（GHSA の ID が無いため例外リストで除外できません）: {n}')
              for b in broken:
                  emit('error', f'audit の結果の構造が不正です（high 以上が隠れている可能性があるため通しません）: {b}')
              for x in expired:
                  emit('error', f'例外の期限切れ: {x}（修正版を確認し、行を消すか期限を延ばしてください）')
              ok = not (errors or blocking or critical or expired or no_id or broken)
              print(f'audit-gate: high以上 {sum(len(p) for _, p in found.values()) + len(no_id)} 件 / 除外 {allowed} 件 / 未登録 {len(blocking)} 件 / critical {len(critical)} 件 / '
                    f'ID なし {len(no_id)} 件 / 構造エラー {len(broken)} 件 / 期限切れ {len(expired)} 件 → {"通過" if ok else "失敗"}')
              return 0 if ok else 1

          if __name__ == '__main__':
              sys.exit(main())
          AUDIT_GATE_PY
          # pnpm の独自の除外設定（auditConfig.ignoreGhsas / ignoreCves）は例外リストを素通りし、理由も期限も残らない。
          # 例外リストの有無にかかわらず、見つけたら落とす（例外リストへ移す）
          # 判定は python3 -I（隔離モード）で動かす。ci.env などの PYTHONPATH・sitecustomize で判定を無効にさせないため
          if [ "$PM" = pnpm ]; then
            # pnpm-workspace.yaml の検査には PyYAML が要る。-I は user site を読まないので、無ければ system に入れる
            if [ -f pnpm-workspace.yaml ] && ! python3 -I -c 'import yaml' 2>/dev/null; then
              { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; } || echo "::warning::python3-yaml を入れられませんでした（apt の出力は上。pnpm-workspace.yaml の検査は落ちます）"
            fi
            python3 -I "$RUNNER_TEMP/audit-gate.py" --pm pnpm --config-only --project-dir . || exit 1
          fi
          if [ -f .github/audit-allowlist ] && [ "$PM" != yarn ]; then
            # audit は脆弱性があると非 0 で終わるので、合否は判定スクリプトに任せる。audit 自体の失敗（{"error":…} や想定外の形）は判定側で落とす
            # pnpm は JSON の advisories 自体を audit-level で絞るので、リポジトリの設定で緩められないよう high を明示する
            # .github/audit-omit-dev があるときだけ本番依存に限る。high の閾値と例外リストの判定は変えない。
            if [ -f .github/audit-omit-dev ]; then
              if [ "$PM" = pnpm ]; then pnpm audit --json --audit-level high --prod > "$RUNNER_TEMP/audit.json" || true
              else npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true; fi
            else
              if [ "$PM" = pnpm ]; then pnpm audit --json --audit-level high > "$RUNNER_TEMP/audit.json" || true
              else npm audit --json > "$RUNNER_TEMP/audit.json" || true; fi
            fi
            python3 -I "$RUNNER_TEMP/audit-gate.py" --pm "$([ "$PM" = pnpm ] && echo pnpm || echo npm)" \
              --allowlist .github/audit-allowlist < "$RUNNER_TEMP/audit.json"
            exit $?
          fi
          if [ -f .github/audit-omit-dev ]; then
            case "$PM" in
              pnpm) pnpm audit --prod --audit-level high ;;
              # yarn は classic/berry で audit の作法が違うため best-effort（CIを落とさない）
              yarn) yarn npm audit --severity high || yarn audit --level high || true ;;
              *)    npm audit --omit=dev --audit-level=high ;;
            esac
          else
            case "$PM" in
              pnpm) pnpm audit --audit-level high ;;
              # yarn は classic/berry で audit の作法が違うため best-effort（CIを落とさない）
              yarn) yarn npm audit --severity high || yarn audit --level high || true ;;
              *)    npm audit --audit-level=high ;;
            esac
          fi

  # コード健全性ゲート（Fallow）: 未使用コード・重複・複雑度・アーキテクチャ境界の検出。
  # 既定は report-only（fail-on-issues: false）。強制したいリポジトリは .github/fallow-strict を置く。
  # ブランチ保護の必須チェックには含めない想定（report-only の間は落ちないため意味がない）。
  quality:
    needs: detect
    if: needs.detect.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 権限は要求しない。Reusable Workflow は呼び出し側（contents: read のみ）より
    # 広い権限を要求すると startup_failure で起動できないため（実測で確認）。
    # そのため React Doctor の PRコメント / commit status は無効にして走らせる。
    steps:
      # React Doctor の changed スコープは base との比較に全履歴が要る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fallow (コード健全性)
        uses: fallow-rs/fallow@3cf8074a0e2e91c895c0a4224ba1c3bec4630d65 # v3.14.0
        with:
          format: markdown
          fail-on-issues: ${{ needs.detect.outputs.fallow-strict }}

      # React アンチパターン検出（AIエージェントが書きがちな不適切なReactコードを捕まえる）。
      # 既定は advisory（blocking: none）。強制は Fallow と同じ .github/fallow-strict でオプトイン。
      - name: React Doctor
        if: needs.detect.outputs.has-react == 'true'
        uses: millionco/react-doctor@d23a0d723c1f56a691c39203036b763299eff012 # react-doctor@0.9.11
        with:
          blocking: ${{ needs.detect.outputs.fallow-strict == 'true' && 'error' || 'none' }}
          # 書き込み権限が無いため出力はジョブログのみ（PRコメント/レビュー/statusは無効）
          comment: "false"
          review-comments: "false"
          commit-status: "false"


  e2e:
    needs: detect
    if: needs.detect.outputs.has-node == 'true' && needs.detect.outputs.has-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ needs.detect.outputs.pm }}

      - name: CI用環境変数を読み込み (.github/ci.env)
        run: |
          if [ -f .github/ci.env ]; then
            grep -v '^\s*#' .github/ci.env >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        env:
          PM: ${{ needs.detect.outputs.pm }}
        run: |
          # lockfile があれば厳格（再現性優先）、無ければ警告して通常インストール（CIを詰まらせない）。
          # lockfile はコミット対象という方針のため、無い場合は警告で是正を促す。
          ignored_builds_help() {
            echo "::error::pnpm の install に失敗しました。ERR_PNPM_IGNORED_BUILDS なら、リポジトリの pnpm-workspace.yaml に allowBuilds を書いてください。"
            echo "::notice::例）allowBuilds:%0A  sharp: false%0A  unrs-resolver: false  # prebuilt があるのでソースビルドは不要"
            echo "::notice::ビルドが本当に必要なパッケージだけ true にしてください。.npmrc の ignore-scripts=true は外さないこと（postinstall 経由の供給網攻撃を防ぐ要）。"
          }
          case "$PM" in
            pnpm)
              # pnpm 10 以降、ビルドスクリプトを持つ依存は「許可するか」を明示しないと
              # ERR_PNPM_IGNORED_BUILDS で install ごと落ちる（.npmrc の ignore-scripts=true と組み合わさるため）。
              # 旧 --config.strict-dep-builds=false は pnpm 12 で効かない（2026-09-22 に 12.5.1 で実測）。
              # 回避策は CLI・環境変数・package.json のいずれにも無く、リポジトリ側の
              # pnpm-workspace.yaml に allowBuilds で各パッケージの可否を書くしかない。
              # 落ちたときに何をすればよいかをログに出す（原因が分からないまま赤くしない）。
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile || { ignored_builds_help; exit 1; }
              else echo "::warning::pnpm-lock.yaml が無いためロック無しインストール（lockfile のコミットを推奨）"; pnpm install || { ignored_builds_help; exit 1; }; fi ;;
            yarn)
              if [ -f yarn.lock ]; then corepack yarn install --immutable || yarn install --frozen-lockfile
              else echo "::warning::yarn.lock が無いためロック無しインストール（lockfile のコミットを推奨）"; yarn install; fi ;;
            *)
              if [ -f package-lock.json ]; then npm ci
              else echo "::warning::package-lock.json が無いためロック無しインストール（lockfile のコミットを推奨）"; npm install; fi ;;
          esac

      - name: DBマイグレーション（スクリプトがあれば）
        env:
          PM: ${{ needs.detect.outputs.pm }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate'] ? 0 : 1)"; then
            "$PM" run db:migrate
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: ${{ needs.detect.outputs.pm }} run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
