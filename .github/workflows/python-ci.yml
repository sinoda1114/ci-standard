# Python 標準CI（Reusable Workflow）
#
# 呼び出し側リポジトリの構成を自動判定し、存在するものだけ実行する:
#   - 依存インストール … requirements.txt / pyproject.toml から判定
#   - ruff (lint) … pyproject.toml に [tool.ruff] があるか ruff.toml があれば実行
#   - pytest … tests/ ディレクトリか test_*.py があれば実行
#   - pip-audit … 依存定義があれば実行（既知脆弱性の検出）
#
# リポジトリ固有のCI用環境変数（非シークレット）は .github/ci.env に置く。
# シークレットは呼び出し側の `secrets: inherit` で届く。
#
# ブランチ保護の必須チェックは「ci / build」を指定する想定。

name: Python CI (standard)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python のバージョン"
        type: string
        required: false
        default: "3.12"

permissions:
  contents: read

jobs:
  # ワークフローの検査（jactionlint）。第三者のバイナリなので、build と切り離した専用のジョブで動かす
  # （トークンを .git/config に残さず、install・ビルド・キャッシュとも同じジョブにしない）。
  # 合否は build の最後のステップがこのジョブの結果を見て決めるので、必須チェック ci / build で止まる。
  #   - 判定: correctness（構文・式・needs などの誤り）だけで落とす。読めない式が 1 つあるとワークフローごと起動しないため
  #   - 助言: 既定プロファイル（SHA 固定・permissions などのセキュリティ・運用ルール）は警告の注釈を出すだけで落とさない
  #   - shellcheck・pyflakes は使わない（目的はワークフローの文法と式）。GitHub への問い合わせもしない
  # correctness には jactionlint が同梱するデータで判定する規則（unknown-runner-label・unknown-action-input など）がある。
  # 新しいランナーや action の入力に追いついておらず誤って落ちたときは、呼び出し側で抑止できる（README の「ワークフローの検査」）。
  # 版とチェックサムは self-test.yml・node-ci.yml と揃える（scripts/check-jactionlint-pins.sh が見る）。
  # 版を上げる手順は self-test.yml のコメントを参照。
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ワークフローの検査（jactionlint）
        env:
          JACTIONLINT_VERSION: '2.2.0'
          JACTIONLINT_SHA256: 8137d5bfe266dd5e48d2af2306827785ce07c6988e04b1c3d6ad4776e97d27d2
        run: |
          tarball="jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --retry 3 --retry-all-errors -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/jdx/jactionlint/releases/download/v${JACTIONLINT_VERSION}/${tarball}" \
            || { echo "::error::jactionlint の取得に失敗しました（ワークフローの誤りではありません。GitHub の障害なら再実行で直ることが多い）"; exit 1; }
          echo "${JACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" jactionlint
          lint() { "$RUNNER_TEMP/jactionlint" --no-hints --no-color --no-online --shellcheck= --pyflakes= "$@"; }
          # 助言。標準 CI の呼び出し（ci-standard/...@main）は設計上 main を追うので、SHA 固定の警告から外す。
          # 終了コード 1 は「指摘あり」。2 以上は実行そのものの失敗なので、黙って消さずに警告を出す
          advisory_rc=0
          lint --format github --ignore 'reusable workflow call "sinoda1114/ci-standard/[^"]*@main" must be pinned' \
            > "$RUNNER_TEMP/advisory.txt" || advisory_rc=$?
          sed -E 's/^::error( |::)/::warning\1/' "$RUNNER_TEMP/advisory.txt"
          if [ "$advisory_rc" -gt 1 ]; then
            echo "::warning::jactionlint の助言の実行が失敗しました（終了コード ${advisory_rc}）"
          fi
          # 判定
          lint --profile correctness

  build:
    needs: workflow-lint
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: CI用環境変数を読み込み (.github/ci.env)
        run: |
          if [ -f .github/ci.env ]; then
            grep -v '^\s*#' .github/ci.env >> "$GITHUB_ENV"
          fi

      - name: 実行対象を判定
        run: |
          echo "HAS_REQUIREMENTS=$([ -f requirements.txt ] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "HAS_PYPROJECT=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_ENV"
          if [ -f ruff.toml ] || { [ -f pyproject.toml ] && grep -q '\[tool\.ruff' pyproject.toml; }; then
            echo "HAS_RUFF=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RUFF=false" >> "$GITHUB_ENV"
          fi
          if [ -d tests ] || ls test_*.py */test_*.py >/dev/null 2>&1; then
            echo "HAS_TESTS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_TESTS=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies (requirements.txt)
        if: env.HAS_REQUIREMENTS == 'true'
        run: pip install -r requirements.txt

      - name: Install dependencies (pyproject.toml)
        if: env.HAS_REQUIREMENTS == 'false' && env.HAS_PYPROJECT == 'true'
        run: pip install -e .

      - name: Lint (ruff)
        if: env.HAS_RUFF == 'true'
        run: |
          pip install ruff
          ruff check .

      - name: Test (pytest)
        if: env.HAS_TESTS == 'true'
        run: |
          pip install pytest
          pytest -x -q

      - name: Audit (pip-audit)
        if: env.HAS_REQUIREMENTS == 'true' || env.HAS_PYPROJECT == 'true'
        run: |
          pip install pip-audit
          pip-audit || true
        # 注: pip-audit は当面 report-only（|| true）。誤検知・修正不能な
        # 推移的依存で全PJのCIが赤くなるのを避けるため。運用が安定したら
        # `|| true` を外して強制化する。

      # ワークフローの検査（workflow-lint ジョブ）の合否をここで反映する。build の needs が失敗すると build はスキップになり、
      # スキップは必須チェックを満たしてしまうため、build を !cancelled() で走らせてここで落とす。
      # 最後に置き、lint・テストなどの結果も出す
      - name: ワークフローの検査（jactionlint）の結果
        if: ${{ !cancelled() }}
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          if [ "$WORKFLOW_LINT_RESULT" != success ]; then
            echo "::error::ワークフローの検査（workflow-lint ジョブ）の結果が ${WORKFLOW_LINT_RESULT} でした。そのジョブのログを見てください"
            exit 1
          fi
