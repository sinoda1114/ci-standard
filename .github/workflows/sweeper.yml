# 標準CI自動見回り（sweeper）
#
# 毎日、全リポジトリを走査して標準CI未導入のNode/Pythonリポジトリへ自動配置し、
# ブランチ保護を冪等に適用する。新規リポジトリの作り方（gh / Web / テンプレ /
# どのAIエージェント経由か）に関係なく、翌日には標準が強制される。
#
# 必要セットアップ（1回だけ）:
#   fine-grained PAT（All repositories / Contents: RW / Administration: RW / Workflows: RW /
#   Issues: RW / Pull requests: RW / Secrets: RW / Code scanning alerts: RW）を
#   このリポジトリの Actions secret `ADMIN_TOKEN` に登録する。
#   GITHUB_TOKEN では他リポジトリへ書き込めないため PAT が必須。
name: sweeper

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch: {}

# 2 本を同時に走らせない（手動起動と定期実行の重なり、手動の二重起動）。
# 走行中の run はキャンセルしない。ブランチ保護を一時解除した直後に止めると戻らない経路があるため、
# 後続を待たせて直列にする。待機できるのは 1 本までで、さらに来ると待機中の古い方が置き換わる（未開始なので害はない）。
concurrency:
  group: sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 85 リポジトリ × REST 約 20 回 + GraphQL（PR 一覧）。従来 5 分前後、pr-triage 配布と掃除で伸びる分の余裕
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ADMIN_TOKEN の存在確認
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Actions secret ADMIN_TOKEN が未設定です（fine-grained PAT: Contents / Administration / Workflows / Issues / Pull requests / Secrets / Code scanning alerts の RW）"
            exit 1
          fi

      - name: 全リポジトリを見回り
        # 既定シェルは bash -e だけで pipefail が無く、| tee で sweep.sh の終了コードが消える。shell: bash で -eo pipefail を付ける
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # pr-triage（PR Bot コメント仕分け）が使う JEV キー。各リポジトリの Secrets に配布する
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bash scripts/sweep.sh | tee -a "$GITHUB_STEP_SUMMARY"
