# このファイルを対象リポジトリの .github/workflows/ci.yml に置く。
# 中身の実体は sinoda1114/ci-standard 側にあり、標準の改善は全リポジトリへ自動反映される。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一refに新しいpushが来たら進行中の旧ジョブをキャンセル（無駄打ち防止）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # `secrets: inherit` は付けない（最小権限）。標準CIはシークレットを一切参照せず、
    # CI用の値は非シークレットの .github/ci.env から供給される。将来シークレットが
    # 必要になったら inherit ではなく `secrets:` マップで必要なものだけ明示的に渡すこと。
    uses: sinoda1114/ci-standard/.github/workflows/node-ci.yml@main
