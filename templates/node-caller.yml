# このファイルを対象リポジトリの .github/workflows/ci.yml に置く。
# 中身の実体は sinoda1114/ci-standard 側にあり、標準の改善は全リポジトリへ自動反映される。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一refに新しいpushが来たら進行中の旧ジョブをキャンセル（無駄打ち防止）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # 必要なシークレットだけ明示マップ（inherit は使わない）。未設定でも optional なので他リポは壊さない。
    uses: sinoda1114/ci-standard/.github/workflows/node-ci.yml@main
    secrets:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
