# このファイルを対象リポジトリの .github/workflows/ci.yml に置く。
# 中身の実体は sinoda1114/ci-standard 側にあり、標準の改善は全リポジトリへ自動反映される。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一refに新しいpushが来たら進行中の旧ジョブをキャンセル（無駄打ち防止）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # `secrets: inherit` は付けない（最小権限）。Clerk 等が要るリポだけ呼び出し側で
    # `secrets:` 明示マップ。未設定なら空。非シークレットは .github/ci.env。
    uses: sinoda1114/ci-standard/.github/workflows/node-ci.yml@main
